[package]
name = "rumiga-desktop"
description = "Rumiga Amiga emulator — desktop binary for development"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
minifb = "0.28"
m68k = { workspace = true }
png = "0.17"
rumiga-core = { path = "../crates/rumiga-core" }
rumiga-platform = { path = "../crates/rumiga-platform" }
rumiga-platform-desktop = { path = "../crates/rumiga-platform-desktop" }
rumiga-api = { path = "../crates/rumiga-api" }
sha2 = "0.10"
axum = { version = "0.8", features = ["macros", "multipart", "json"] }
tokio = { version = "1.52", features = ["full"] }
rust-embed = "8.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
percent-encoding = "2.3"
core_affinity = "0.8"
libslirp = { version = "4.3.2", default-features = false }
mio = "0.6.23"

[lints]
workspace = true

[dev-dependencies]
r68k-emu = { workspace = true }
r68k-common = { workspace = true }
