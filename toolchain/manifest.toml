schema_version = 1
profile = "d1001-espidf"
status = "cross-built-not-hil"

[target]
board = "seeed-reterminal-d1001"
soc = "esp32p4"
rust = "riscv32imafc-esp-espidf"
cargo_package = "rumiga-firmware"
physical_flash = "32MB"
configured_flash = "16MB"
physical_psram = "32MB"

[portable_rust]
target = "riscv32imafc-unknown-none-elf"
scope = "portable-core-boundary"

[[portable_rust.profiles]]
name = "foundation"
packages = ["m68000", "rumiga-api", "rumiga-platform"]
release = false
default_features = true
features = []

[[portable_rust.profiles]]
name = "stock-amiga-core"
packages = ["m68k", "rumiga-core"]
release = true
default_features = false
features = ["no_std"]

# The portable core graph is closed: exactly these crates and nothing else.
#
# This is stronger than "only approved no_std crates". The stock core today resolves to
# three workspace crates and no third-party dependency at all, so the contract states
# that rather than a licence to add vetted ones. Pulling any external crate into the
# core fails the portable gate, which is the point: a crate that is `no_std` today can
# gain a `std` path, an allocator assumption, or a platform dependency in a patch
# release, and the portable compile alone would not necessarily catch it.
[portable_rust.core_graph]
profile = "stock-amiga-core"
root = "rumiga-core"
crates = ["m68k", "rumiga-core", "rumiga-platform"]

[host]
rust = "1.97.1"
rust_msrv = "1.85.0"
node = "26.7.0"
npm = "11.19.0"

[embedded_rust]
channel = "nightly-2026-07-27"
components = ["rust-src"]
build_std = ["std", "panic_abort"]

[esp_idf]
version = "6.0.0"
git_reference = "tag:v6.0"
commit = "662a3be354759d9487bf4b1a629fadb766cb1800"
repository = "https://github.com/espressif/esp-idf.git"
tools_install_dir = "workspace"
compatibility = "rust-cross-build"

[esp_idf_patch_candidate]
version = "6.0.2"
git_reference = "tag:v6.0.2"
commit = "7101770dc6db2667b3c477cc31365dd1acd6db4e"
repository = "https://github.com/espressif/esp-idf.git"
status = "awaiting-upstream-rust-compatibility"
blockers = [
    "esp-idf-hal c2dac82 does not initialize the DSI bus flags field added by ESP-IDF 6.0.2",
    "No Rumiga cross-build or D1001 HIL evidence exists for ESP-IDF 6.0.2",
]

[d1001_idf6_evidence]
repository = "https://github.com/metaneutrons/Vellum.git"
revision = "15bff64d316c3751861d02fcf7ace6b47afab176"
idf_version = "6.0.0"
idf_commit = "662a3be354759d9487bf4b1a629fadb766cb1800"
target = "esp32p4"
scope = ["build", "boot", "display", "touch", "audio", "usb", "wifi"]
source_license = "AGPL-3.0-or-later"
usage = "authorized-source-reuse"
reuse_authorization = "copyright-holder-authorized-for-rumiga-gpl-3.0-only"
destination_license = "GPL-3.0-only"
provenance_policy = "docs/provenance/VELLUM_REUSE.md"
third_party_policy = "separate-license-review-required"

[seeed_bsp]
commit = "5074d3b2f45626b261298e305aaf792036febc5a"
repository = "https://github.com/Seeed-Studio/reTerminal-D1001.git"
esp_idf_version = "5.4.2"
license = "Apache-2.0"
role = "hardware-reference-only"

[esp_rust_crates]
esp_idf_svc = "0.52.1"
esp_idf_hal = "0.46.2"
esp_idf_sys = "0.37.2"
embuild = "0.33.3"

[esp_rust_patches]
esp_idf_svc_repository = "https://github.com/esp-rs/esp-idf-svc.git"
esp_idf_svc_commit = "f59ffada5638cf582fe8cab1771fa38873ef6d73"
esp_idf_hal_repository = "https://github.com/esp-rs/esp-idf-hal.git"
