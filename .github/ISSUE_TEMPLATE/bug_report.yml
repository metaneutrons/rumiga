name: Bug report
description: Report a reproducible Rumiga defect without attaching private media.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not attach ROMs, ADFs, HDFs, private screenshots, credentials, or packet captures.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Describe the incorrect behavior in one sentence.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Rumiga revision
      description: Provide the full git SHA and state whether the tree was dirty.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - macOS desktop
        - Linux desktop
        - Seeed reTerminal D1001
        - CI or cross-build
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal steps, model, CPU, PAL/NTSC mode, and safe media hashes when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence
      description: Link checksummed public evidence or provide redacted logs and reproduction commands.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not attach copyrighted media, credentials, private endpoints, or local filesystem paths.
          required: true
