name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_AUDIT_VERSION: "0.22.2"
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  EMBEDDED_RUST_CHANNEL: "nightly-2026-07-27"
  ESPFLASH_VERSION: "4.5.0"
  LDPROXY_VERSION: "0.3.5"
  NEXT_TELEMETRY_DISABLED: "1"
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  commits:
    name: Commit Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1 --profile minimal --no-self-update

      - name: Cache Rust build inputs
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: commit-policy-linux

      - name: Run commit policy gate
        env:
          RUMIGA_COMMIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RUMIGA_COMMIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          RUMIGA_PR_TITLE: ${{ github.event.pull_request.title }}
        run: cargo +1.97.1 xtask ci --gate commits

      - name: Publish commit policy summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'single-commit' }}
          RANGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "## Conventional commit policy"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Base | \`${RANGE_BASE}\` |"
            echo "| Head | \`${RANGE_HEAD}\` |"
            echo "| Pull-request title | Validated when present |"
            echo "| Merge commits | Rejected |"
            echo "| Result | ${JOB_STATUS} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  lockfiles:
    name: Lockfile Integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1 --profile minimal
          --component clippy,rustfmt --no-self-update

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install pinned npm
        run: |
          npm_version="$(node -p "require('./web/package.json').packageManager.split('@').at(-1)")"
          npm install --global --ignore-scripts --no-audit --no-fund "npm@${npm_version}"
          test "$(npm --version)" = "${npm_version}"

      - name: Run lockfile gate
        run: cargo +1.97.1 xtask ci --gate lockfiles

      - name: Publish lockfile summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Lockfile integrity"
            echo
            echo "| Gate | Result |"
            echo "| --- | --- |"
            echo "| Cargo locked resolution | ${JOB_STATUS} |"
            echo "| npm clean install without lifecycle scripts | ${JOB_STATUS} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  governance:
    name: Engineering Governance Evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1 --profile minimal --no-self-update

      - name: Cache Rust build inputs
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: governance-linux

      - name: Run governance gate
        run: cargo +1.97.1 xtask ci --gate governance

      - name: Upload governance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governance-${{ github.sha }}
          path: target/m0-012-governance-evidence
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Publish governance summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          manifest=target/m0-012-governance-evidence/manifest.json
          {
            echo "## Engineering governance evidence"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Contracts | $(jq -r '.summary.contracts // "unavailable"' "${manifest}" 2>/dev/null || echo unavailable) |"
            echo "| ADRs / release notes / change records | $(jq -r '[.summary.architecture_decisions, .summary.release_notes, .summary.change_records] | join(" / ")' "${manifest}" 2>/dev/null || echo unavailable) |"
            echo "| Test / evidence references | $(jq -r '[.summary.test_references, .summary.evidence_references] | join(" / ")' "${manifest}" 2>/dev/null || echo unavailable) |"
            echo "| Artifact | governance-${GITHUB_SHA} |"
            echo "| Result | ${JOB_STATUS} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  host:
    name: Host / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            os: ubuntu-24.04
          - label: macOS arm64
            os: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux host dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libglib2.0-dev \
            libslirp-dev \
            pkg-config

      - name: Install macOS host dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          # The hosted image carries this unused tap; remove it before Homebrew's trust check.
          if brew tap | grep -Fqx "aws/tap"; then
            brew untap aws/tap
          fi
          brew install libslirp pkg-config

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1 --profile minimal
          --component clippy,rustfmt --no-self-update

      - name: Cache Rust build inputs
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: host-${{ matrix.os }}

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install pinned npm
        run: |
          npm_version="$(node -p "require('./web/package.json').packageManager.split('@').at(-1)")"
          npm install --global --ignore-scripts --no-audit --no-fund "npm@${npm_version}"
          test "$(npm --version)" = "${npm_version}"

      - name: Run host gate
        run: cargo +1.97.1 xtask ci --gate host

      - name: Publish host summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          MATRIX_LABEL: ${{ matrix.label }}
          MATRIX_OS: ${{ matrix.os }}
        run: |
          {
            echo "## Host validation: ${MATRIX_LABEL}"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Runner | \`${MATRIX_OS}\` |"
            echo "| Architecture | \`$(uname -m)\` |"
            echo "| Rust | \`$(rustc --version 2>/dev/null || echo unavailable)\` |"
            echo "| Node.js | \`$(node --version 2>/dev/null || echo unavailable)\` |"
            echo "| npm | \`$(npm --version 2>/dev/null || echo unavailable)\` |"
            echo "| Result | ${JOB_STATUS} |"
            echo
            echo "Rust format, the rumiga-core std/no_std matrix, Clippy, tests, documentation, web lint, and web build are required."
          } >> "${GITHUB_STEP_SUMMARY}"

  compatibility:
    name: Public Compatibility Evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libglib2.0-dev \
            libslirp-dev \
            pkg-config

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1 --profile minimal --no-self-update

      - name: Cache Rust build inputs
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: compatibility-linux

      - name: Run compatibility gate
        run: cargo +1.97.1 xtask ci --gate compatibility

      - name: Upload public compatibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-${{ github.sha }}
          path: target/m0-011-compatibility-evidence
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Publish compatibility summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          manifest=target/m0-011-compatibility-evidence/manifest.json
          {
            echo "## Public compatibility evidence"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Scenario pass / skipped / unsupported | $(jq -r '[.summary.compatibility.pass, .summary.compatibility.skipped, .summary.compatibility.unsupported] | join(" / ")' "${manifest}" 2>/dev/null || echo unavailable) |"
            echo "| Tests discovered / ignored / runnable | $(jq -r '[.summary.tests.discovered, .summary.tests.ignored, .summary.tests.runnable] | join(" / ")' "${manifest}" 2>/dev/null || echo unavailable) |"
            echo "| Private media included | $(jq -r '.scope.private_media_included // "unavailable"' "${manifest}" 2>/dev/null || echo unavailable) |"
            echo "| Artifact | compatibility-${GITHUB_SHA} |"
            echo "| Result | ${JOB_STATUS} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  supply-chain:
    name: Supply Chain Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1 --profile minimal --no-self-update

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install pinned npm
        run: |
          npm_version="$(node -p "require('./web/package.json').packageManager.split('@').at(-1)")"
          npm install --global --ignore-scripts --no-audit --no-fund "npm@${npm_version}"
          test "$(npm --version)" = "${npm_version}"

      - name: Install pinned supply-chain tools
        run: |
          cargo +1.97.1 install --locked --version "${CARGO_AUDIT_VERSION}" cargo-audit
          cargo +1.97.1 install --locked --version "${CARGO_DENY_VERSION}" cargo-deny

      - name: Run supply-chain gate
        run: cargo +1.97.1 xtask ci --gate supply-chain

      - name: Upload supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-${{ github.sha }}
          path: target/m0-009-supply-chain-evidence
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Publish supply-chain summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          manifest=target/m0-009-supply-chain-evidence/manifest.json
          {
            echo "## Supply-chain policy"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Rust packages | \`$(jq -r '.rust.packages // "unavailable"' "${manifest}" 2>/dev/null || echo unavailable)\` |"
            echo "| npm packages | \`$(jq -r '.npm.packages // "unavailable"' "${manifest}" 2>/dev/null || echo unavailable)\` |"
            echo "| Action references | \`$(jq -r '.github_actions.references // "unavailable"' "${manifest}" 2>/dev/null || echo unavailable)\` |"
            echo "| Active reviewed exceptions | \`$(jq -r '.active_exception_ids | length' "${manifest}" 2>/dev/null || echo unavailable)\` |"
            echo "| Artifact | \`supply-chain-${GITHUB_SHA}\` |"
            echo "| Result | ${JOB_STATUS} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  portable:
    name: Portable Rust / RISC-V no_std
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust target
        run: |
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          portable_target="$(awk -F '"' '
            /^\[portable_rust\]$/ { section = 1; next }
            section && /^target =/ { print $2; exit }
          ' toolchain/manifest.toml)"
          test -n "${portable_target}"
          rustup target add --toolchain 1.97.1 "${portable_target}"

      - name: Cache Rust build inputs
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: portable-riscv

      - name: Run portable gate
        run: cargo +1.97.1 xtask ci --gate portable

      - name: Publish portable Rust summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          portable_target="$(awk -F '"' '
            /^\[portable_rust\]$/ { section = 1; next }
            section && /^target =/ { print $2; exit }
          ' toolchain/manifest.toml)"
          {
            echo "## Portable Rust boundary"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Target | \`${portable_target}\` |"
            echo "| Packages | \`m68000\`, \`rumiga-api\`, \`rumiga-platform\` |"
            echo "| Result | ${JOB_STATUS} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  firmware:
    name: Firmware / ESP32-P4 release evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ESP-IDF prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            bison \
            ccache \
            cmake \
            dfu-util \
            flex \
            gperf \
            jq \
            libffi-dev \
            libssl-dev \
            libudev-dev \
            libusb-1.0-0 \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            python3-venv \
            wget

      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup toolchain install "${EMBEDDED_RUST_CHANNEL}" \
            --profile minimal --component rust-src --no-self-update

      - name: Cache Rust build inputs
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-targets: false
          shared-key: firmware-esp32p4

      - name: Install pinned firmware tools
        run: |
          cargo +1.97.1 install --locked --version "${LDPROXY_VERSION}" ldproxy
          cargo +1.97.1 install --locked --version "${ESPFLASH_VERSION}" espflash

      - name: Run firmware gate
        run: cargo +1.97.1 xtask ci --gate firmware

      - name: Upload firmware evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-esp32p4-${{ github.sha }}
          path: target/m0-008-firmware-evidence
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Publish firmware summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          manifest=target/m0-008-firmware-evidence/manifest.json
          {
            echo "## ESP32-P4 firmware evidence"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Board | \`$(jq -r '.board // "unavailable"' "${manifest}" 2>/dev/null || echo unavailable)\` |"
            echo "| Target | \`$(jq -r '.target // "unavailable"' "${manifest}" 2>/dev/null || echo unavailable)\` |"
            echo "| ESP-IDF | \`$(jq -r '.esp_idf.version // "unavailable"' "${manifest}" 2>/dev/null || echo unavailable)\` |"
            echo "| Artifact | \`firmware-esp32p4-${GITHUB_SHA}\` |"
            echo "| Result | ${JOB_STATUS} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  quality-gate:
    name: Required Quality Gate
    if: always()
    needs: [commits, lockfiles, governance, host, compatibility, supply-chain, portable, firmware]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Publish and enforce aggregate result
        env:
          COMMIT_RESULT: ${{ needs.commits.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          FIRMWARE_RESULT: ${{ needs.firmware.result }}
          GOVERNANCE_RESULT: ${{ needs.governance.result }}
          HOST_RESULT: ${{ needs.host.result }}
          LOCKFILE_RESULT: ${{ needs.lockfiles.result }}
          PORTABLE_RESULT: ${{ needs.portable.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
        run: |
          aggregate=success
          if [[ "${COMMIT_RESULT}" != success || "${LOCKFILE_RESULT}" != success || "${GOVERNANCE_RESULT}" != success || "${HOST_RESULT}" != success || "${COMPATIBILITY_RESULT}" != success || "${SUPPLY_CHAIN_RESULT}" != success || "${PORTABLE_RESULT}" != success || "${FIRMWARE_RESULT}" != success ]]; then
            aggregate=failure
          fi

          {
            echo "## Required quality gate"
            echo
            echo "| Required job | Result |"
            echo "| --- | --- |"
            echo "| Conventional Commit Policy | ${COMMIT_RESULT} |"
            echo "| Lockfile Integrity | ${LOCKFILE_RESULT} |"
            echo "| Engineering Governance Evidence | ${GOVERNANCE_RESULT} |"
            echo "| Host matrix (Linux x86_64, macOS arm64) | ${HOST_RESULT} |"
            echo "| Public Compatibility Evidence | ${COMPATIBILITY_RESULT} |"
            echo "| Supply Chain Policy | ${SUPPLY_CHAIN_RESULT} |"
            echo "| Portable Rust / RISC-V no_std | ${PORTABLE_RESULT} |"
            echo "| Firmware / ESP32-P4 release evidence | ${FIRMWARE_RESULT} |"
            echo "| Aggregate | **${aggregate}** |"
          } >> "${GITHUB_STEP_SUMMARY}"

          test "${aggregate}" = success
