name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_AUDIT_VERSION: "0.22.2"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  EMBEDDED_RUST_CHANNEL: "nightly-2026-07-27"
  ESPFLASH_VERSION: "4.5.0"
  LDPROXY_VERSION: "0.3.5"
  NEXT_TELEMETRY_DISABLED: "1"
  PORTABLE_RUST_TARGET: "riscv32imafc-unknown-none-elf"
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  lockfiles:
    name: Lockfile Integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1 --profile minimal
          --component clippy,rustfmt --no-self-update

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install pinned npm
        run: |
          npm_version="$(node -p "require('./web/package.json').packageManager.split('@').at(-1)")"
          npm install --global --ignore-scripts --no-audit --no-fund "npm@${npm_version}"
          test "$(npm --version)" = "${npm_version}"

      - name: Verify Cargo lockfile
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Verify npm lockfile
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify npm advisories
        working-directory: web
        run: npm audit --audit-level=high

      - name: Verify lockfiles are unchanged
        run: git diff --exit-code -- Cargo.lock web/package-lock.json

      - name: Publish lockfile summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Lockfile integrity"
            echo
            echo "| Gate | Result |"
            echo "| --- | --- |"
            echo "| Cargo locked resolution | ${JOB_STATUS} |"
            echo "| npm clean install and high advisory threshold | ${JOB_STATUS} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  host:
    name: Host / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            os: ubuntu-24.04
          - label: macOS arm64
            os: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux host dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libglib2.0-dev \
            libslirp-dev \
            pkg-config

      - name: Install macOS host dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install libslirp pkg-config

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1 --profile minimal
          --component clippy,rustfmt --no-self-update

      - name: Cache Rust build inputs
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: host-${{ matrix.os }}

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install pinned npm
        run: |
          npm_version="$(node -p "require('./web/package.json').packageManager.split('@').at(-1)")"
          npm install --global --ignore-scripts --no-audit --no-fund "npm@${npm_version}"
          test "$(npm --version)" = "${npm_version}"

      - name: Verify pinned host tools
        run: |
          expected_rust="$(awk -F '"' '/^channel =/ { print $2; exit }' rust-toolchain.toml)"
          expected_node="$(tr -d '[:space:]' < .node-version)"
          expected_npm="$(node -p "require('./web/package.json').packageManager.split('@').at(-1)")"
          test "$(rustc --version | awk '{ print $2 }')" = "${expected_rust}"
          test "$(node --version)" = "v${expected_node}"
          test "$(npm --version)" = "${expected_npm}"
          rustc --version --verbose
          node --version
          npm --version

      - name: Install web dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint web application
        working-directory: web
        run: npm run lint

      - name: Build web application
        working-directory: web
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        run: cargo test --locked --workspace

      - name: Build Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps

      - name: Verify repository remains clean
        run: git diff --exit-code

      - name: Publish host summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          MATRIX_LABEL: ${{ matrix.label }}
          MATRIX_OS: ${{ matrix.os }}
        run: |
          {
            echo "## Host validation: ${MATRIX_LABEL}"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Runner | \`${MATRIX_OS}\` |"
            echo "| Architecture | \`$(uname -m)\` |"
            echo "| Rust | \`$(rustc --version 2>/dev/null || echo unavailable)\` |"
            echo "| Node.js | \`$(node --version 2>/dev/null || echo unavailable)\` |"
            echo "| npm | \`$(npm --version 2>/dev/null || echo unavailable)\` |"
            echo "| Result | ${JOB_STATUS} |"
            echo
            echo "Rust format, Clippy, tests, documentation, web lint, and web build are required."
          } >> "${GITHUB_STEP_SUMMARY}"

  audit:
    name: Rust Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1 --profile minimal --no-self-update

      - name: Install pinned cargo-audit
        run: >-
          cargo install --locked --version "${CARGO_AUDIT_VERSION}"
          cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit --file Cargo.lock

      - name: Publish audit summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Rust dependency audit"
            echo
            echo "Result: **${JOB_STATUS}**"
          } >> "${GITHUB_STEP_SUMMARY}"

  portable:
    name: Portable Rust / RISC-V no_std
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust target
        run: |
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup target add --toolchain 1.97.1 "${PORTABLE_RUST_TARGET}"

      - name: Cache Rust build inputs
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: portable-riscv

      - name: Check current no_std boundaries
        run: >-
          cargo +1.97.1 check --locked --target "${PORTABLE_RUST_TARGET}"
          -p m68000 -p rumiga-api -p rumiga-platform

      - name: Verify repository remains clean
        run: git diff --exit-code

      - name: Publish portable Rust summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Portable Rust boundary"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Target | \`${PORTABLE_RUST_TARGET}\` |"
            echo "| Packages | \`m68000\`, \`rumiga-api\`, \`rumiga-platform\` |"
            echo "| Result | ${JOB_STATUS} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  firmware:
    name: Firmware / ESP32-P4 release evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ESP-IDF prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            bison \
            ccache \
            cmake \
            dfu-util \
            flex \
            gperf \
            jq \
            libffi-dev \
            libssl-dev \
            libudev-dev \
            libusb-1.0-0 \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            python3-venv \
            wget

      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup toolchain install "${EMBEDDED_RUST_CHANNEL}" \
            --profile minimal --component rust-src --no-self-update

      - name: Cache Rust build inputs
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-targets: false
          shared-key: firmware-esp32p4

      - name: Install pinned firmware tools
        run: |
          cargo +1.97.1 install --locked --version "${LDPROXY_VERSION}" ldproxy
          cargo +1.97.1 install --locked --version "${ESPFLASH_VERSION}" espflash

      - name: Build and verify firmware evidence
        run: cargo +1.97.1 xtask firmware-evidence

      - name: Verify artifact checksums
        working-directory: target/m0-008-firmware-evidence
        run: sha256sum --check SHA256SUMS

      - name: Verify repository remains clean
        run: git diff --exit-code

      - name: Upload firmware evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-esp32p4-${{ github.sha }}
          path: target/m0-008-firmware-evidence
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Publish firmware summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          manifest=target/m0-008-firmware-evidence/manifest.json
          {
            echo "## ESP32-P4 firmware evidence"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Board | \`$(jq -r '.board // "unavailable"' "${manifest}" 2>/dev/null || echo unavailable)\` |"
            echo "| Target | \`$(jq -r '.target // "unavailable"' "${manifest}" 2>/dev/null || echo unavailable)\` |"
            echo "| ESP-IDF | \`$(jq -r '.esp_idf.version // "unavailable"' "${manifest}" 2>/dev/null || echo unavailable)\` |"
            echo "| Artifact | \`firmware-esp32p4-${GITHUB_SHA}\` |"
            echo "| Result | ${JOB_STATUS} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  quality-gate:
    name: Required Quality Gate
    if: always()
    needs: [lockfiles, host, audit, portable, firmware]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Publish and enforce aggregate result
        env:
          AUDIT_RESULT: ${{ needs.audit.result }}
          FIRMWARE_RESULT: ${{ needs.firmware.result }}
          HOST_RESULT: ${{ needs.host.result }}
          LOCKFILE_RESULT: ${{ needs.lockfiles.result }}
          PORTABLE_RESULT: ${{ needs.portable.result }}
        run: |
          aggregate=success
          if [[ "${LOCKFILE_RESULT}" != success || "${HOST_RESULT}" != success || "${AUDIT_RESULT}" != success || "${PORTABLE_RESULT}" != success || "${FIRMWARE_RESULT}" != success ]]; then
            aggregate=failure
          fi

          {
            echo "## Required quality gate"
            echo
            echo "| Required job | Result |"
            echo "| --- | --- |"
            echo "| Lockfile Integrity | ${LOCKFILE_RESULT} |"
            echo "| Host matrix (Linux x86_64, macOS arm64) | ${HOST_RESULT} |"
            echo "| Rust Security Audit | ${AUDIT_RESULT} |"
            echo "| Portable Rust / RISC-V no_std | ${PORTABLE_RESULT} |"
            echo "| Firmware / ESP32-P4 release evidence | ${FIRMWARE_RESULT} |"
            echo "| Aggregate | **${aggregate}** |"
          } >> "${GITHUB_STEP_SUMMARY}"

          test "${aggregate}" = success
