version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-routine:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
      time: "05:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps-web)"
    groups:
      npm-routine:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
