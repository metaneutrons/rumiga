version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-routine:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:05'
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: '05:30'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps-web)"
    groups:
      npm-routine:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        versions: ['>=6.1']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:45'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    rebase-strategy: auto
    commit-message:
      prefix: "chore(ci-deps)"
    groups:
      actions-routine:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
