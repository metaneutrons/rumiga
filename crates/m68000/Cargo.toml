[package]
name = "m68000"
version = "0.2.3"
authors = ["Stovent <23307724+Stovent@users.noreply.github.com>"]
edition = "2024"
license = "MPL-2.0"
description = "A Motorola 68000 interpreter, disassembler and assembler (code emitter) — no_std fork"
repository = "https://github.com/Stovent/m68000"
keywords = ["motorola", "68000", "m68k", "interpreter", "emulator"]
categories = ["emulators"]
readme = "README.md"
rust-version = "1.85.0"

[features]
default = []
ffi = []

[lib]
crate-type = ["lib"]

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "instruction"
harness = false

[[bench]]
name = "interpreter"
harness = false

[[bench]]
name = "memory"
harness = false

[[bench]]
name = "operands"
harness = false

[lints.clippy]
# Forked crate — we enforce correctness (all) but relax style (pedantic/nursery)
all = { level = "deny", priority = -1 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
precedence = "allow"
new_without_default = "allow"
type_complexity = "allow"
manual_range_contains = "allow"
nonminimal_bool = "allow"
wrong_self_convention = "allow"
bool_assert_comparison = "allow"
unnecessary_cast = "allow"
collapsible_else_if = "allow"

[lints.rust]
unsafe_code = "forbid"
unused_imports = "allow"
